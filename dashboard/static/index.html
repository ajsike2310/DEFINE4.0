<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true">☎</span><span>Outreach<br><small>Automated calls</small></span></div>
    <nav>
      <a href="#/" data-nav="overview">Overview</a>
      <a href="#/events" data-nav="events">Events</a>
      <a href="#/followups" data-nav="followups">Follow-ups <span id="task-count" class="count" hidden></span></a>
