# Alembic command line:  alembic -c member2/backend/alembic.ini <command>   (run from the repo root)
# The app runs migrations itself at start-up; use this for history, downgrade or authoring new revisions.
[alembic]
script_location = member2/backend/migrations
# Leave empty to use DATABASE_URL / the app settings.
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s %(name)s %(message)s
